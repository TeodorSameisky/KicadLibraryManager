<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KiCad Library Manager</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main>
      <h1>Hello, world 👋</h1>
      <p class="lead">KiCad Library Manager is up and running.</p>

      <p class="meta">{% if auth_configured %}OAuth2 authentication enabled{% else %}Authentication not configured{% endif %}</p>
    </main>
  </body>
</html>
