services:
  web:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    # Every setting is read from the environment; .env.example lists them.
    env_file: .env
    volumes:
      # The library's clones. A named volume takes the image's ownership, so
      # the app can write to it; a bind mount would keep the host's.
      - library-data:/data
    restart: unless-stopped

volumes:
  library-data:
